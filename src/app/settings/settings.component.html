<button (click)="handleSettings()">⚙️</button>
<ng-container *ngIf="isSettingsOpen">
    <div class="settings-container theme-{{themeService.getTheme()}}">
        <h2>Settings</h2>
        <label for="theme">Theme</label>
        <select id="theme" (change)="handleTheme($event)" [value]="themeService.getTheme()">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
        <div class="settings-footer">
            <button (click)="handleSettings()">❌</button>
        </div>
    </div>
</ng-container>
