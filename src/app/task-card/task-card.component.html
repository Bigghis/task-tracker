<div class="task-card">
    <div class="task-title">
      <ng-content></ng-content>
      <div class="task-title-text">{{ task.title }} 
        <app-task-type [type]="task.type" [class]="task.type | lowercase"></app-task-type>
      </div>
      <!-- <div class="task-date">{{task?.createdAt | date:'dd/MM/yyyy HH:mm' }}</div> -->
    </div>
    <p class="task-description">{{ task.description }}</p>
    <input type="checkbox" [checked]="task.completed" (change)="toggleComplete(task.id)" />
    <!-- <div class="task-actions">
      <button class="task-action-button" (click)="updateTask()" >Update</button>
      <button class="task-action-button" (click)="deleteTask()">Delete</button>
    </div> -->
  </div>
